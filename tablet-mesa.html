<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cardápio Mesa Interativo</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/phosphor/src/bold/style.css">
  <link rel="stylesheet" href="/vendor/phosphor/src/fill/style.css">
  <script src="/socket.io/socket.io.js"></script>

  <style>
    :root { --bg: #f8fafc; --panel: #ffffff; --primary: #fc4b15; --text: #0f172a; --muted: #64748b; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
    
    body { background-color: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

    /* Esquerda: Categorias (Menu Lateral) */
    .sidebar { width: 120px; background: #1e293b; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 20px; z-index: 10; box-shadow: 4px 0 15px rgba(0,0,0,0.1); }
    .cat-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; color: #94a3b8; cursor: pointer; transition: 0.2s; padding: 12px; width: 100%; }
    .cat-btn i { font-size: 32px; }
    .cat-btn span { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .cat-btn.active { color: #fff; border-right: 4px solid var(--primary); background: rgba(255,255,255,0.05); }

    /* Centro: Produtos */
    .main-area { flex: 1; display: flex; flex-direction: column; position: relative; }
    .top-bar { padding: 20px 32px; background: var(--panel); border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
    .tb-mesa { font-family: 'Outfit'; font-size: 24px; font-weight: 900; color: var(--primary); display: flex; align-items: center; gap: 8px; }
    .btn-chamar { background: #fee2e2; color: #ef4444; border: none; padding: 10px 20px; border-radius: 20px; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 14px; transition: transform 0.2s; }
    .btn-chamar:active { transform: scale(0.95); }
    
    .products-grid { padding: 32px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 24px; flex: 1; }
    .p-card { background: var(--panel); border: 1px solid #e2e8f0; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.03); cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; }
    .p-card:active { transform: scale(0.96); }
    .p-img { height: 160px; background-color: #e2e8f0; background-size: cover; background-position: center; }
    .p-info { padding: 16px; flex: 1; display: flex; flex-direction: column; }
    .p-name { font-family: 'Outfit'; font-size: 18px; font-weight: 800; margin-bottom: 4px; line-height: 1.2; }
    .p-desc { font-size: 12px; color: var(--muted); margin-bottom: 12px; flex: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .p-price { font-size: 20px; font-weight: 900; color: var(--primary); font-family: 'Outfit'; }

    /* Direita: Carrinho / Comanda Viva */
    .cart-area { width: 350px; background: var(--panel); border-left: 1px solid #e2e8f0; display: flex; flex-direction: column; box-shadow: -4px 0 15px rgba(0,0,0,0.03); z-index: 10; }
    .cart-header { padding: 24px; border-bottom: 1px solid #e2e8f0; }
    .cart-header h2 { font-family: 'Outfit'; font-size: 20px; font-weight: 800; display: flex; justify-content: space-between; }
    
    .cart-items { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .c-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #e2e8f0; padding-bottom: 16px; }
    .c-item-name { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
    .c-item-price { font-size: 14px; font-weight: 800; color: var(--muted); }
    .c-controls { display: flex; align-items: center; gap: 12px; background: #f1f5f9; padding: 4px; border-radius: 20px; }
    .c-btn { width: 28px; height: 28px; border-radius: 50%; background: #fff; border: 1px solid #cbd5e1; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; color: var(--text); }
    .c-qtd { font-weight: 800; width: 16px; text-align: center; }

    .cart-footer { padding: 24px; border-top: 1px solid #e2e8f0; background: #f8fafc; }
    .cf-row { display: flex; justify-content: space-between; font-weight: 700; font-size: 14px; color: var(--muted); margin-bottom: 8px; }
    .cf-total { display: flex; justify-content: space-between; font-family: 'Outfit'; font-weight: 900; font-size: 24px; color: var(--text); margin-bottom: 20px; }
    .btn-send { width: 100%; background: var(--primary); color: #fff; border: none; padding: 20px; border-radius: 16px; font-family: 'Outfit'; font-size: 18px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 15px rgba(252, 75, 21, 0.3); transition: transform 0.2s; text-transform: uppercase; letter-spacing: 1px; }
    .btn-send:active { transform: scale(0.98); }

    /* Modal Produto */
    .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(4px); z-index: 100; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s; }
    .modal-overlay.active { display: flex; opacity: 1; }
    .modal-content { background: var(--panel); width: 500px; border-radius: 24px; overflow: hidden; transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .modal-overlay.active .modal-content { transform: scale(1); }
    .m-img { height: 250px; background-size: cover; background-position: center; position: relative; }
    .m-close { position: absolute; top: 16px; right: 16px; width: 40px; height: 40px; background: rgba(0,0,0,0.5); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; border: none; backdrop-filter: blur(4px); }
    .m-body { padding: 32px; }
    .m-title { font-family: 'Outfit'; font-size: 28px; font-weight: 900; margin-bottom: 8px; }
    .m-desc { color: var(--muted); font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
    .m-obs { width: 100%; padding: 16px; border: 1px solid #cbd5e1; border-radius: 12px; font-size: 14px; outline: none; margin-bottom: 24px; font-family: 'Inter'; resize: none; }
    .m-obs:focus { border-color: var(--primary); }
    .m-footer { display: flex; gap: 16px; align-items: center; }
    .m-price { font-family: 'Outfit'; font-size: 32px; font-weight: 900; color: var(--primary); flex: 1; }
    .btn-add { background: var(--text); color: #fff; border: none; padding: 16px 32px; border-radius: 16px; font-weight: 800; font-size: 16px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: transform 0.2s; }
    .btn-add:active { transform: scale(0.95); }

    /* Toast */
    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: #10b981; color: #fff; padding: 16px 32px; border-radius: 30px; font-weight: 700; font-size: 16px; box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 1000; display: flex; align-items: center; gap: 8px; }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <!-- Menu Lateral -->
  <aside class="sidebar">
    <div class="cat-btn active"><i class="ph-fill ph-hamburger"></i><span>Lanches</span></div>
    <div class="cat-btn"><i class="ph-fill ph-pizza"></i><span>Pizzas</span></div>
    <div class="cat-btn"><i class="ph-fill ph-pint-glass"></i><span>Bebidas</span></div>
    <div class="cat-btn"><i class="ph-fill ph-ice-cream"></i><span>Doces</span></div>
  </aside>

  <!-- Principal -->
  <main class="main-area">
    <div class="top-bar">
      <div class="tb-mesa"><i class="ph-fill ph-cube"></i> <span id="label-mesa">Mesa 01</span></div>
      <button class="btn-chamar" onclick="chamarGarcom()"><i class="ph-bold ph-bell-ringing"></i> Chamar Garçom</button>
    </div>
    
    <div class="products-grid" id="grid-produtos">
      <!-- Injetado via JS -->
    </div>
  </main>

  <!-- Carrinho -->
  <aside class="cart-area">
    <div class="cart-header">
      <h2>Seu Pedido <i class="ph-fill ph-shopping-bag"></i></h2>
    </div>
    
    <div class="cart-items" id="cart-items">
      <div style="text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; font-weight: 500;">Adicione itens tocando neles.</div>
    </div>
    
    <div class="cart-footer">
      <div class="cf-row"><span>Subtotal</span><span id="c-sub">R$ 0,00</span></div>
      <div class="cf-total"><span>Total</span><span id="c-tot">R$ 0,00</span></div>
      <button class="btn-send" onclick="enviarPedido()"><i class="ph-bold ph-paper-plane-right"></i> Enviar p/ Cozinha</button>
      
      <button onclick="pedirConta()" style="width:100%; background:transparent; color: var(--muted); border: 1px solid var(--border); padding: 16px; border-radius: 12px; margin-top: 12px; font-weight: 700; cursor: pointer;"><i class="ph-bold ph-receipt"></i> Pedir a Conta / Pagar</button>
    </div>
  </aside>

  <!-- Modal Produto -->
  <div class="modal-overlay" id="modal-prod">
    <div class="modal-content">
      <div class="m-img" id="m-img" style="background-image: url('https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=600');">
        <button class="m-close" onclick="fecharModal()"><i class="ph-bold ph-x"></i></button>
      </div>
      <div class="m-body">
        <h2 class="m-title" id="m-title">Produto</h2>
        <p class="m-desc" id="m-desc">Descrição do produto vai aqui.</p>
        <textarea class="m-obs" id="m-obs" rows="2" placeholder="Alguma observação? (Ex: Sem cebola, carne ao ponto)"></textarea>
        <div class="m-footer">
          <div class="m-price" id="m-price">R$ 0,00</div>
          <button class="btn-add" onclick="confirmarAdd()"><i class="ph-bold ph-plus"></i> Adicionar</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"><i class="ph-bold ph-check-circle"></i> <span>Enviado para a cozinha!</span></div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const mesaName = urlParams.get('mesa') || 'Mesa 01';
    document.getElementById('label-mesa').innerText = mesaName;

    const token = localStorage.getItem('chef_token') || '';
    const restId = localStorage.getItem('restaurante_id') || '1';
    const socket = io({ query: { token, restaurante_id: restId } });

    // Mock Catalog
    const catalogo = [
      { id: 1, nome: 'Cheff Smash Double', desc: 'Pão brioche, 2x smash burger 90g, cheddar, bacon e maionese da casa.', preco: 32.90, img: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=400' },
      { id: 2, nome: 'Classic Salad', desc: 'Pão com gergelim, burger 160g, queijo prato, alface, tomate e cebola roxa.', preco: 28.50, img: 'https://images.unsplash.com/photo-1550547660-d9450f859349?q=80&w=400' },
      { id: 3, nome: 'Batata Rústica c/ Cheddar', desc: 'Porção individual de batatas rústicas com creme de cheddar e farofa de bacon.', preco: 18.90, img: 'https://images.unsplash.com/photo-1576107248386-d2bc50616a10?q=80&w=400' },
      { id: 4, nome: 'Coca-Cola Lata 350ml', desc: 'Refrigerante gelado.', preco: 6.50, img: 'https://images.unsplash.com/photo-1622483767028-3f66f32aef97?q=80&w=400' }
    ];

    let carrinho = [];
    let prodAtivo = null;

    function renderCatalogo() {
      const grid = document.getElementById('grid-produtos');
      grid.innerHTML = catalogo.map(p => `
        <div class="p-card" onclick="abrirModal(${p.id})">
          <div class="p-img" style="background-image: url('${p.img}');"></div>
          <div class="p-info">
            <h3 class="p-name">${p.nome}</h3>
            <p class="p-desc">${p.desc}</p>
            <div class="p-price">R$ ${p.preco.toFixed(2).replace('.',',')}</div>
          </div>
        </div>
      `).join('');
    }

    function abrirModal(id) {
      prodAtivo = catalogo.find(p => p.id === id);
      document.getElementById('m-title').innerText = prodAtivo.nome;
      document.getElementById('m-desc').innerText = prodAtivo.desc;
      document.getElementById('m-price').innerText = 'R$ ' + prodAtivo.preco.toFixed(2).replace('.',',');
      document.getElementById('m-img').style.backgroundImage = `url('${prodAtivo.img}')`;
      document.getElementById('m-obs').value = '';
      
      document.getElementById('modal-prod').classList.add('active');
    }

    function fecharModal() { document.getElementById('modal-prod').classList.remove('active'); }

    function confirmarAdd() {
      const obs = document.getElementById('m-obs').value.trim();
      
      const exists = carrinho.find(c => c.id === prodAtivo.id && c.obs === obs);
      if(exists) exists.qtd++;
      else carrinho.push({ ...prodAtivo, qtd: 1, obs: obs });

      fecharModal();
      renderCart(); const btn=document.querySelector('.btn-send'); if(btn){ const o=btn.innerHTML; btn.innerHTML='<i class="ph-bold ph-check-circle"></i> Enviado!'; btn.style.background='var(--green)'; setTimeout(()=> {btn.innerHTML=o; btn.style.background='var(--primary)';}, 3000); }
    }

    function alteraQtd(index, delta) {
      carrinho[index].qtd += delta;
      if(carrinho[index].qtd <= 0) carrinho.splice(index, 1);
      renderCart(); const btn=document.querySelector('.btn-send'); if(btn){ const o=btn.innerHTML; btn.innerHTML='<i class="ph-bold ph-check-circle"></i> Enviado!'; btn.style.background='var(--green)'; setTimeout(()=> {btn.innerHTML=o; btn.style.background='var(--primary)';}, 3000); }
    }

    function renderCart() {
      const cont = document.getElementById('cart-items');
      if(carrinho.length === 0) {
        cont.innerHTML = `<div style="text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; font-weight: 500;">Adicione itens tocando neles.</div>`;
        document.getElementById('c-sub').innerText = 'R$ 0,00';
        document.getElementById('c-tot').innerText = 'R$ 0,00';
        return;
      }

      let total = 0;
      let html = '';

      carrinho.forEach((c, idx) => {
        let lineTot = c.preco * c.qtd;
        total += lineTot;
        
        html += `
          <div class="c-item">
            <div style="flex: 1; padding-right: 12px;">
              <div class="c-item-name">${c.nome}</div>
              <div class="c-item-price">R$ ${lineTot.toFixed(2).replace('.',',')}</div>
              ${c.obs ? `<div style="font-size: 11px; color: #ef4444; margin-top: 4px;">* ${c.obs}</div>` : ''}
            </div>
            <div class="c-controls">
              <button class="c-btn" onclick="alteraQtd(${idx}, -1)">-</button>
              <div class="c-qtd">${c.qtd}</div>
              <button class="c-btn" onclick="alteraQtd(${idx}, 1)">+</button>
            </div>
          </div>
        `;
      });

      cont.innerHTML = html;
      let fTot = 'R$ ' + total.toFixed(2).replace('.',',');
      document.getElementById('c-sub').innerText = fTot;
      document.getElementById('c-tot').innerText = fTot;
    }

    function enviarPedido() {
      if(carrinho.length === 0) return;

      let total = carrinho.reduce((acc, c) => acc + (c.preco * c.qtd), 0);
      let payloadItems = carrinho.map(c => ({ id: c.id, name: c.nome, qty: c.qtd, price: c.preco, obs: c.obs }));
      
      let nomeExibicao = carrinho.map(c => `${c.qtd}x ${c.nome}`).join(', ');

      const payload = {
        productName: nomeExibicao,
        total: total,
        userName: 'Mesa Local',
        localName: mesaName,
        sector: 'Cozinha',
        status: 'Novo',
        produtos_envolvidos: JSON.stringify(payloadItems) // Compatibilidade KDS V2 / Expedicao
      };

      socket.emit('novo_pedido', payload);
      
      carrinho = [];
      renderCart(); const btn=document.querySelector('.btn-send'); if(btn){ const o=btn.innerHTML; btn.innerHTML='<i class="ph-bold ph-check-circle"></i> Enviado!'; btn.style.background='var(--green)'; setTimeout(()=> {btn.innerHTML=o; btn.style.background='var(--primary)';}, 3000); }
      
      const t = document.getElementById('toast');
      t.querySelector('span').innerText = 'Enviado para a cozinha!';
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    function chamarGarcom() {
      socket.emit('chamar_garcom', { mesa: mesaName });
      const t = document.getElementById('toast');
      t.querySelector('span').innerText = 'Garçom chamado!';
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    function pedirConta() {
      if(!confirm('Deseja encerrar e pedir a conta? O garçom levará a maquininha.')) return;
      socket.emit('fechar_conta', { mesa: mesaName });
      const t = document.getElementById('toast');
      t.querySelector('span').innerText = 'Conta solicitada. Aguarde o garçom.';
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 4000);
    }

    renderCatalogo();
  </script>
</body>
</html>
