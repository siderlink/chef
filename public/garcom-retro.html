<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Garçom (Modo Retro)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <style>
    body { font-family: sans-serif; background: #f0f0f0; margin: 0; padding: 0; }
    .header { background: #3ab55b; color: white; padding: 15px; font-size: 18px; font-weight: bold; text-align: center; }
    .container { padding: 10px; }
    .card { background: white; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc; }
    .btn { background: #3ab55b; color: white; padding: 10px; text-align: center; font-size: 16px; border-radius: 5px; border: none; width: 100%; display: block; margin-top: 10px; cursor: pointer; font-weight: bold; }
    .btn-secondary { background: #666; }
    .list-item { padding: 10px; border-bottom: 1px solid #eee; font-size: 16px; }
    .list-item:active { background: #ddd; }
    h3 { margin-top: 0; }
    input[type="text"], input[type="number"] { width: 90%; padding: 10px; font-size: 16px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; }
    #cart-badge { background: red; color: white; border-radius: 10px; padding: 2px 6px; font-size: 12px; position: absolute; right: 10px; top: 15px; cursor: pointer; }
  </style>
  <script src="/theme-manager.js"></script>
  <script src="/locales.js"></script>
  <script src="/i18n.js"></script>
</head>
<body>
  <div class="header">
    <span id="header-title">Mesas</span>
    <span id="cart-badge" style="display:none;" onclick="showCart()">0</span>
  </div>
  
  <div class="container" id="app">
    Carregando...
  </div>

  <script>
    var state = {
      view: 'mesas',
      mesas: [],
      cardapio: [],
      mesaSelecionada: null,
      produtoSelecionado: null,
      carrinho: [],
      nomeGarcom: 'Garçom Retro'
    };

    function escHtml(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
    function escJs(s) { return JSON.stringify(String(s == null ? '' : s)).replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }

    function ajax(method, url, data, callback) {
      var xhr = new XMLHttpRequest();
      xhr.open(method, url, true);
      if (data) xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status === 200) {
            callback(null, JSON.parse(xhr.responseText));
          } else {
            callback(xhr.status);
          }
        }
      };
      xhr.send(data ? JSON.stringify(data) : null);
    }

    function render() {
      var app = document.getElementById('app');
      var title = document.getElementById('header-title');
      var badge = document.getElementById('cart-badge');

      if (state.carrinho.length > 0) {
        badge.style.display = 'inline-block';
        badge.innerHTML = state.carrinho.length;
      } else {
        badge.style.display = 'none';
      }

      var html = '';

      if (state.view === 'mesas') {
        title.innerHTML = 'Selecione uma Mesa';
        html += '<input type="text" id="input-garcom" value="' + escHtml(state.nomeGarcom) + '" placeholder="Seu Nome" onchange="state.nomeGarcom=this.value">';
        html += '<button class="btn btn-secondary" onclick="loadMesas()">Atualizar Mesas</button><br>';
        
        html += '<input type="text" id="input-nova-mesa" placeholder="Nº da Mesa ou Comanda">';
        html += '<button class="btn" onclick="abrirMesaDigitada()">Abrir Mesa Digitada</button>';
        
        html += '<h3>Mesas Ativas</h3>';
        if (state.mesas.length === 0) {
          html += '<p>Nenhuma mesa encontrada.</p>';
        }
        for (var i = 0; i < state.mesas.length; i++) {
          var m = state.mesas[i];
          html += '<div class="card list-item" onclick="abrirMesa(' + escJs(m.nome) + ')"><b>' + escHtml(m.nome) + '</b> (Status: ' + escHtml(m.status) + ')</div>';
        }
      } 
      else if (state.view === 'cardapio') {
        title.innerHTML = 'Mesa: ' + escHtml(state.mesaSelecionada);
        html += '<button class="btn btn-secondary" onclick="voltarMesas()">Trocar Mesa</button><br>';
        html += '<h3>Cardápio</h3>';
        for (var j = 0; j < state.cardapio.length; j++) {
          var p = state.cardapio[j];
          html += '<div class="card list-item" onclick="abrirProduto(' + j + ')"><b>' + escHtml(p.nome) + '</b> <br>R$ ' + parseFloat(p.preco).toFixed(2).replace('.', ',') + '</div>';
        }
      }
      else if (state.view === 'produto') {
        var p = state.produtoSelecionado;
        title.innerHTML = 'Adicionar';
        html += '<div class="card">';
        html += '<h3>' + escHtml(p.nome) + '</h3>';
        html += '<p>R$ ' + parseFloat(p.preco).toFixed(2).replace('.', ',') + '</p>';
        html += '<label>Quantidade:</label><br>';
        html += '<input type="number" id="prod-qtd" value="1"><br>';
        html += '<label>Observações:</label><br>';
        html += '<input type="text" id="prod-obs" placeholder="Ex: Sem cebola"><br>';
        html += '<label>Composições:</label><br>';
        html += '<div id="retro-comps-section" style="display:none;margin-bottom:4px;"><div id="retro-montavel-cats"></div><div id="retro-montavel-preco" style="font-weight:700;color:#8b5cf6;margin-top:4px;"></div><input type="hidden" id="retro-comps-json" value="[]"></div>';
        html += '<button class="btn" onclick="addCarrinho()">Adicionar ao Pedido</button>';
        html += '<button class="btn btn-secondary" onclick="state.view=\'cardapio\'; render()">Cancelar</button>';
        html += '</div>';
      }
      else if (state.view === 'carrinho') {
        title.innerHTML = 'Carrinho - Mesa: ' + escHtml(state.mesaSelecionada);
        if (state.carrinho.length === 0) {
          html += '<p>Carrinho vazio.</p>';
          html += '<button class="btn btn-secondary" onclick="state.view=\'cardapio\'; render()">Voltar ao Cardápio</button>';
        } else {
          for (var k = 0; k < state.carrinho.length; k++) {
            var item = state.carrinho[k];
            html += '<div class="card"><b>' + item.quantity + 'x ' + escHtml(item.productName) + '</b><br>Obs: ' + escHtml(item.observations) + (item.composicoes && item.composicoes.length > 0 ? '<br>Monte: ' + escHtml(item.composicoes.map(function(c) { return typeof c === 'object' ? c.categoria + ': ' + c.opcao : c; }).join(' | ')) : '') + '<br><button style="margin-top:5px; padding: 5px; background: red; color: white; border: none; border-radius: 3px;" onclick="removerItem(' + k + ')">Remover</button></div>';
          }
          html += '<button class="btn" id="btn-enviar" onclick="enviarPedido()">Enviar Pedido p/ Cozinha</button>';
          html += '<button class="btn btn-secondary" onclick="state.view=\'cardapio\'; render()">Adicionar Mais Itens</button>';
        }
      }

      app.innerHTML = html;
    }

    function loadMesas() {
      ajax('GET', '/api/retro/mesas', null, function(err, data) {
        if (!err && data && data.mesas) {
          state.mesas = data.mesas;
          render();
        }
      });
    }

    function loadCardapio() {
      ajax('GET', '/api/retro/cardapio', null, function(err, data) {
        if (!err && data && data.produtos) {
          state.cardapio = data.produtos;
          render();
        }
      });
    }

    function abrirMesa(nome) {
      state.mesaSelecionada = nome;
      state.view = 'cardapio';
      render();
    }

    function abrirMesaDigitada() {
      var val = document.getElementById('input-nova-mesa').value;
      if (val) {
        abrirMesa(val);
      }
    }

    function voltarMesas() {
      state.mesaSelecionada = null;
      state.view = 'mesas';
      loadMesas();
    }

    function abrirProduto(idx) {
      state.produtoSelecionado = state.cardapio[idx];
      state.view = 'produto';
      render();
      fetchRetroMontavel(state.cardapio[idx].id);
    }

    var _retroComps = [];
    var _retroMontavelConfig = null;

    function fetchRetroMontavel(productId) {
      _retroMontavelConfig = null;
      _retroComps = [];
      var section = document.getElementById('retro-comps-section');
      if (section) section.style.display = 'none';
      ajax('GET', '/api/montaveis/produto/' + productId, null, function(err, data) {
        if (!err && data && data.id) { _retroMontavelConfig = data; renderRetroMontavelUI(); }
      });
    }

    function renderRetroMontavelUI() {
      var section = document.getElementById('retro-comps-section');
      var catsContainer = document.getElementById('retro-montavel-cats');
      var precoEl = document.getElementById('retro-montavel-preco');
      var hiddenInput = document.getElementById('retro-comps-json');
      if (!section || !_retroMontavelConfig) { if (section) section.style.display = 'none'; return; }
      section.style.display = 'block';
      var p = state.produtoSelecionado;
      _retroComps = _retroMontavelConfig.categorias.map(function() { return []; });

      catsContainer.innerHTML = _retroMontavelConfig.categorias.map(function(cat, ci) {
        var isSingle = cat.max_escolhas === 1;
        var optsHtml = cat.opcoes.map(function(opt, oi) {
          var inputType = isSingle ? 'radio' : 'checkbox';
          var inputName = 'rretro-' + ci;
          return '<label style="display:flex;align-items:center;gap:6px;padding:5px 8px;background:white;border:1px solid #e2e8f0;border-radius:6px;cursor:pointer;font-size:12px;">' +
            '<input type="' + inputType + '" name="' + inputName + '" value="' + oi + '" onchange="onRetroMontavelSelect(' + ci + ',' + oi + ',' + isSingle + ')">' +
            '<span style="flex:1;">' + escHtml(opt.nome) + '</span>' +
            (opt.preco > 0 ? '<span style="color:#3b82f6;font-weight:700;font-size:11px;">+R$' + opt.preco.toFixed(2).replace('.', ',') + '</span>' : '') +
            '</label>';
        }).join('');
        return '<div style="margin-bottom:8px;"><div style="font-size:11px;font-weight:700;color:#475569;margin-bottom:3px;">' + escHtml(cat.nome) +
          (cat.obrigatoria ? ' <span style="color:#dc2626;">*</span>' : '') +
          (cat.max_escolhas > 1 ? ' <span style="color:#94a3b8;font-weight:400;">(até ' + cat.max_escolhas + ')</span>' : '') +
          '</div><div style="display:flex;flex-direction:column;gap:3px;">' + optsHtml + '</div></div>';
      }).join('');
      updateRetroMontavelPrice();
      if (hiddenInput) hiddenInput.value = JSON.stringify(_retroComps);
    }

    window.onRetroMontavelSelect = function(catIdx, optIdx, isSingle) {
      if (isSingle) { _retroComps[catIdx] = [optIdx]; }
      else {
        var arr = _retroComps[catIdx];
        var pos = arr.indexOf(optIdx);
        if (pos >= 0) arr.splice(pos, 1);
        else { var max = _retroMontavelConfig.categorias[catIdx].max_escolhas || 1; if (arr.length < max) arr.push(optIdx); }
      }
      updateRetroMontavelPrice();
      var hiddenInput = document.getElementById('retro-comps-json');
      if (hiddenInput) hiddenInput.value = JSON.stringify(_retroComps);
    };

    function updateRetroMontavelPrice() {
      var precoEl = document.getElementById('retro-montavel-preco');
      if (!precoEl || !_retroMontavelConfig) return;
      var p = state.produtoSelecionado;
      var total = _retroMontavelConfig.pricing_model === 'fixo' ? _retroMontavelConfig.preco_fixo : p.preco;
      if (_retroMontavelConfig.pricing_model === 'soma') {
        _retroMontavelConfig.categorias.forEach(function(cat, ci) {
          (_retroComps[ci] || []).forEach(function(oi) { if (cat.opcoes[oi]) total += cat.opcoes[oi].preco || 0; });
        });
      }
      var qtd = parseInt(document.getElementById('prod-qtd') ? document.getElementById('prod-qtd').value : 1) || 1;
      precoEl.textContent = 'Total: R$ ' + (total * qtd).toFixed(2).replace('.', ',');
    }

    function addCarrinho() {
      var qtd = parseInt(document.getElementById('prod-qtd').value) || 1;
      var obs = document.getElementById('prod-obs').value || '';
      var p = state.produtoSelecionado;
      var rawComps = JSON.parse(document.getElementById('retro-comps-json') ? (document.getElementById('retro-comps-json').value || '[]') : '[]');
      var composicoes = [];
      var unitPrice = p.preco;

      if (_retroMontavelConfig) {
        _retroMontavelConfig.categorias.forEach(function(cat, ci) {
          (rawComps[ci] || []).forEach(function(oi) {
            var opt = cat.opcoes[oi];
            if (opt) composicoes.push({ categoria: cat.nome, opcao: opt.nome, preco: opt.preco || 0 });
          });
        });
        var precoEl = document.getElementById('retro-montavel-preco');
        unitPrice = precoEl && precoEl.dataset.unitPrice ? parseFloat(precoEl.dataset.unitPrice) : unitPrice;
      } else {
        composicoes = rawComps;
      }

      state.carrinho.push({
        userName: state.nomeGarcom,
        mesa_comanda: state.mesaSelecionada,
        productName: p.nome,
        quantity: qtd,
        observations: obs,
        composicoes: composicoes,
        printer: p.impressora || '',
        sector: p.setor || '',
        total: unitPrice * qtd
      });

      _retroComps = [];
      _retroMontavelConfig = null;
      state.produtoSelecionado = null;
      state.view = 'cardapio';
      render();
    }

    function removerItem(idx) {
      state.carrinho.splice(idx, 1);
      render();
    }

    function showCart() {
      if (state.mesaSelecionada) {
        state.view = 'carrinho';
        render();
      }
    }

    function enviarPedido() {
      if (state.carrinho.length === 0) return;
      var btn = document.getElementById('btn-enviar');
      btn.innerHTML = 'Enviando...';
      btn.disabled = true;

      var sentCount = 0;
      var total = state.carrinho.length;

      for (var i = 0; i < total; i++) {
        var item = state.carrinho[i];
        ajax('POST', '/api/retro/pedido', item, function(err, res) {
          sentCount++;
          if (sentCount === total) {
            alert('Pedido enviado com sucesso!');
            state.carrinho = [];
            state.view = 'cardapio';
            render();
          }
        });
      }
    }

    // Inicialização
    loadCardapio();
    loadMesas();
  </script>
</body>
</html>
