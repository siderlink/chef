<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KDS Multi-Praças • Chef Cozinha</title>
  <link rel="icon" href="/icon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg: #07090e;
      --surface: #0f1523;
      --card-bg: #141c2e;
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #f97316;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      --accent-cyan: #06b6d4;
      --accent-purple: #8b5cf6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Header Superior */
    header {
      background: var(--surface);
      border-bottom: 2px solid var(--card-border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #f97316, #ef4444);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.4);
    }

    .brand-title h1 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-badge {
      font-size: 10.5px;
      font-weight: 800;
      background: rgba(249, 115, 22, 0.2);
      color: var(--primary);
      border: 1px solid rgba(249, 115, 22, 0.4);
      padding: 2px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    /* Seletor de Praças */
    .pracas-nav {
      display: flex;
      gap: 8px;
      background: rgba(0,0,0,0.3);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
    }

    .praca-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .praca-btn:hover {
      color: var(--text);
      background: rgba(255,255,255,0.05);
    }

    .praca-btn.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 2px 10px rgba(249, 115, 22, 0.35);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ctrl-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .ctrl-btn:hover {
      background: rgba(255,255,255,0.12);
    }

    /* Grid de Pedidos */
    .kds-container {
      padding: 20px;
      flex: 1;
    }

    .kds-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 18px;
      align-items: start;
    }

    /* Card do Pedido */
    .order-card {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 6px 25px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }

    .order-card:hover {
      transform: translateY(-2px);
    }

    /* SLA Bordas e Cabeçalhos */
    .order-card.sla-verde { border-color: rgba(16, 185, 129, 0.4); }
    .order-card.sla-verde .card-header { background: rgba(16, 185, 129, 0.12); border-bottom: 1px solid rgba(16, 185, 129, 0.25); }
    
    .order-card.sla-amarelo { border-color: rgba(245, 158, 11, 0.5); }
    .order-card.sla-amarelo .card-header { background: rgba(245, 158, 11, 0.15); border-bottom: 1px solid rgba(245, 158, 11, 0.3); }

    .order-card.sla-vermelho { 
      border-color: #ef4444; 
      animation: pulseAlert 2s infinite alternate;
    }
    .order-card.sla-vermelho .card-header { background: rgba(239, 68, 68, 0.25); border-bottom: 1px solid rgba(239, 68, 68, 0.4); }

    @keyframes pulseAlert {
      from { box-shadow: 0 0 10px rgba(239, 68, 68, 0.2); }
      to { box-shadow: 0 0 25px rgba(239, 68, 68, 0.6); }
    }

    .card-header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .order-ident {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .order-id {
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 800;
      color: #fff;
    }

    .order-mesa {
      background: rgba(255,255,255,0.1);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
    }

    .order-timer {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-body {
      padding: 16px;
      flex: 1;
    }

    .cliente-info {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .items-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 8px 10px;
      background: rgba(0,0,0,0.25);
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.03);
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }

    .item-row:hover {
      background: rgba(255,255,255,0.03);
    }

    .item-row.done {
      opacity: 0.45;
      text-decoration: line-through;
      background: rgba(16, 185, 129, 0.08);
      border-color: rgba(16, 185, 129, 0.2);
    }

    .item-check {
      margin-top: 2px;
      width: 18px;
      height: 18px;
      accent-color: var(--accent-green);
      cursor: pointer;
    }

    .item-qty {
      font-family: var(--font-mono);
      font-weight: 800;
      color: var(--primary);
      font-size: 14px;
      min-width: 22px;
    }

    .item-details {
      flex: 1;
    }

    .item-name {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }

    .item-obs {
      font-size: 12px;
      color: #f87171;
      font-weight: 600;
      margin-top: 3px;
    }

    .item-tag {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      margin-left: 6px;
    }

    .tag-bar { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
    .tag-forno { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .tag-cozinha { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .tag-sobremesas { background: rgba(168, 85, 247, 0.2); color: #c084fc; }

    /* Footer do Card */
    .card-footer {
      padding: 12px 16px;
      background: rgba(0,0,0,0.3);
      border-top: 1px solid var(--card-border);
      display: flex;
      gap: 8px;
    }

    .btn-chamar-tv {
      flex: 1;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 10px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-chamar-tv:hover {
      background: rgba(59, 130, 246, 0.2);
      border-color: #3b82f6;
      color: #60a5fa;
    }

    .btn-concluir {
      flex: 1.3;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      transition: all 0.2s;
    }

    .btn-concluir:hover {
      background: #059669;
      transform: translateY(-1px);
    }

    /* Estado Vazio */
    .empty-kds {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-kds-icon {
      font-size: 48px;
      margin-bottom: 14px;
      opacity: 0.6;
    }

    .empty-kds h3 {
      font-size: 18px;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header>
    <div class="brand-area">
      <div class="brand-logo">🍳</div>
      <div class="brand-title">
        <h1>KDS Cozinha <span class="brand-badge">Multi-Praças</span></h1>
      </div>
    </div>

    <!-- Navegação de Praças -->
    <nav class="pracas-nav">
      <button class="praca-btn active" data-praca="todas" onclick="selecionarPraca('todas')">
        🔥 Todas
      </button>
      <button class="praca-btn" data-praca="cozinha" onclick="selecionarPraca('cozinha')">
        🥩 Chapa & Cozinha
      </button>
      <button class="praca-btn" data-praca="forno" onclick="selecionarPraca('forno')">
        🍕 Forno / Pizza
      </button>
      <button class="praca-btn" data-praca="bar" onclick="selecionarPraca('bar')">
        🍹 Bar & Bebidas
      </button>
      <button class="praca-btn" data-praca="sobremesas" onclick="selecionarPraca('sobremesas')">
        🍨 Sobremesas
      </button>
      <button class="praca-btn" data-praca="expedicao" onclick="selecionarPraca('expedicao')">
        📦 Expedição
      </button>
    </nav>

    <!-- Controles -->
    <div class="header-controls">
      <button class="ctrl-btn" id="btnSom" onclick="toggleSom()">
        🔊 Alertas Sonoros
      </button>
      <button class="ctrl-btn" onclick="toggleFullscreen()">
        ⛶ Tela Cheia
      </button>
      <div style="font-family:var(--font-mono); font-weight:800; font-size:15px; color:var(--text);" id="clockDisplay">
        --:--:--
      </div>
    </div>
  </header>

  <!-- Container KDS -->
  <main class="kds-container">
    <div class="kds-grid" id="kdsGrid">
      <div class="empty-kds">
        <div class="empty-kds-icon">👨‍🍳</div>
        <h3>Carregando pedidos ativos...</h3>
        <p>Aguardando comunicação com o servidor.</p>
      </div>
    </div>
  </main>

  <script>
    let pracaAtual = 'todas';
    let somHabilitado = true;
    let pedidosCache = [];

    // Relógio
    setInterval(() => {
      const now = new Date();
      document.getElementById('clockDisplay').innerText = now.toLocaleTimeString('pt-BR');
    }, 1000);

    function toggleSom() {
      somHabilitado = !somHabilitado;
      const btn = document.getElementById('btnSom');
      btn.innerText = somHabilitado ? '🔊 Alertas Sonoros' : '🔇 Mudo';
      btn.style.color = somHabilitado ? 'var(--text)' : 'var(--accent-red)';
    }

    function tocarBip(freq = 600, dur = 0.15) {
      if (!somHabilitado) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + dur);
      } catch (e) {}
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    function selecionarPraca(praca) {
      pracaAtual = praca;
      document.querySelectorAll('.praca-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-praca') === praca);
      });
      renderizarPedidos();
    }

    async function buscarPedidos() {
      try {
        const res = await fetch(`/api/kds/pedidos-ativos?praca=${pracaAtual}`);
        const data = await res.json();
        if (data && data.success) {
          if (data.pedidos && data.pedidos.length > pedidosCache.length) {
            tocarBip(880, 0.3);
          }
          pedidosCache = data.pedidos || [];
          renderizarPedidos();
        }
      } catch (e) {
        console.error('Erro ao buscar pedidos KDS:', e);
      }
    }

    function renderizarPedidos() {
      const grid = document.getElementById('kdsGrid');
      if (!pedidosCache || pedidosCache.length === 0) {
        grid.innerHTML = `
          <div class="empty-kds">
            <div class="empty-kds-icon">✨</div>
            <h3>Cozinha em Dia!</h3>
            <p>Nenhum pedido pendente nesta praça no momento.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = pedidosCache.map(p => {
        const mins = p.minutos_decorridos || 0;
        const slaClass = p.sla_nivel === 'vermelho' ? 'sla-vermelho' : (p.sla_nivel === 'amarelo' ? 'sla-amarelo' : 'sla-verde');
        const tagEstacao = p.estacao ? `<span class="item-tag tag-${p.estacao}">${p.estacao}</span>` : '';

        return `
          <div class="order-card ${slaClass}" id="card-pedido-${p.id}">
            <div class="card-header">
              <div class="order-ident">
                <span class="order-id">#${p.id}</span>
                <span class="order-mesa">${p.mesa}</span>
              </div>
              <div class="order-timer">
                ⏱️ <span>${mins}m</span>
              </div>
            </div>

            <div class="card-body">
              <div class="cliente-info">
                👤 ${p.cliente || 'Consumidor'} • ${p.criado_em ? p.criado_em.slice(11, 16) : ''}
              </div>

              <div class="items-list">
                <div class="item-row" onclick="toggleItemFeito(this)">
                  <input type="checkbox" class="item-check" onclick="event.stopPropagation(); toggleItemFeito(this.closest('.item-row'))">
                  <span class="item-qty">${p.quantidade}x</span>
                  <div class="item-details">
                    <div class="item-name">${p.produto} ${tagEstacao}</div>
                    ${p.observacoes ? `<div class="item-obs">⚠️ ${p.observacoes}</div>` : ''}
                  </div>
                </div>
              </div>
            </div>

            <div class="card-footer">
              <button class="btn-chamar-tv" onclick="chamarNaTv(${p.id}, '${p.cliente || 'Cliente'}')">
                📢 Chamar TV
              </button>
              <button class="btn-concluir" onclick="concluirPedido(${p.id})">
                ✓ Concluir
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleItemFeito(el) {
      el.classList.toggle('done');
      const chk = el.querySelector('.item-check');
      if (chk) chk.checked = el.classList.contains('done');
      tocarBip(700, 0.08);
    }

    async function concluirPedido(id) {
      tocarBip(1046, 0.2);
      try {
        const res = await fetch('/api/kds/concluir-pedido', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, chamar_tv: true })
        });
        const data = await res.json();
        if (data && data.success) {
          pedidosCache = pedidosCache.filter(p => p.id !== id);
          renderizarPedidos();
        }
      } catch (e) {
        alert('Erro ao concluir pedido: ' + e.message);
      }
    }

    async function chamarNaTv(id, cliente) {
      tocarBip(880, 0.25);
      const senhaNum = String(id).slice(-3);
      try {
        await fetch('/api/painel-tv/chamar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            senha: senhaNum,
            cliente: cliente,
            tipo: 'Retirada Balcão',
            texto_fala: `Senha ${senhaNum}, ${cliente}, favor retirar no balcão.`
          })
        });
        alert(`📢 Senha #${senhaNum} enviada com voz para a TV de Senhas!`);
      } catch (e) {
        alert('Erro ao chamar na TV: ' + e.message);
      }
    }

    // Inicialização
    buscarPedidos();
    setInterval(buscarPedidos, 6000);

    // Socket.IO Tempo Real
    try {
      const socket = io();
      socket.on('pedidos_atualizados', () => buscarPedidos());
      socket.on('novo_pedido', () => {
        tocarBip(900, 0.4);
        buscarPedidos();
      });
      socket.on('pedido_status_alterado', () => buscarPedidos());
    } catch (e) {}
  </script>
</body>
</html>
