<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Display Cliente (Totem) | Chef Cozinha</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root { --bg: #ffffff; --card: #f8fafc; --text: #0f172a; --primary: #fc4b15; --green: #10b981; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; height: 100vh; display: flex; }
        .cart-side { width: 60%; padding: 40px; display: flex; flex-direction: column; }
        .pay-side { width: 40%; background: var(--card); padding: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-left: 2px solid #e2e8f0; }
        .logo { font-size: 32px; font-weight: 900; color: var(--primary); display: flex; align-items: center; gap: 10px; margin-bottom: 40px; }
        .item-list { flex: 1; overflow-y: auto; }
        .item { display: flex; justify-content: space-between; font-size: 24px; padding: 20px 0; border-bottom: 2px solid #e2e8f0; }
        .item-name { font-weight: 700; }
        .item-price { color: #64748b; }
        .total-box { font-size: 48px; font-weight: 900; color: var(--primary); margin-top: 20px; }
        .qr-code { width: 300px; height: 300px; background: #fff; border: 4px solid var(--green); border-radius: 20px; padding: 20px; box-shadow: 0 10px 25px rgba(16,185,129,0.2); display: flex; align-items: center; justify-content: center; }
        .promo-banner { background: var(--primary); color: #fff; padding: 20px; border-radius: 16px; margin-top: 40px; text-align: center; font-size: 20px; font-weight: bold; width: 80%; }
    </style>
</head>
<body>
    <div class="cart-side">
        <div class="logo"><i class="ph-fill ph-cooking-pot"></i> Chef Cozinha</div>
        <h2 style="font-size:32px; margin-top:0;">Seu Pedido</h2>
        <div class="item-list">
            <div class="item"><span class="item-name">2x Hambúrguer Duplo</span><span class="item-price">R$ 70,00</span></div>
            <div class="item"><span class="item-name">1x Batata Frita Grande</span><span class="item-price">R$ 25,00</span></div>
            <div class="item"><span class="item-name">2x Coca-Cola Lata</span><span class="item-price">R$ 14,00</span></div>
        </div>
        <div style="font-size:24px; color:#64748b; margin-top:20px;">Total a pagar:</div>
        <div class="total-box">R$ 109,00</div>
    </div>
    <div class="pay-side">
        <h2 style="font-size:32px; color:var(--green); margin-top:0;"><i class="ph-bold ph-qr-code"></i> Pague com PIX</h2>
        <p style="font-size:20px; color:#64748b; text-align:center; margin-bottom:40px;">Aponte a câmera do seu celular para o código abaixo. A aprovação é na hora!</p>
        <div class="qr-code">
            <!-- Placehoder QR Code -->
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=00020126580014br.gov.bcb.pix0136bba789eb-5e63-4f92-9f6b-199a0f4477db5204000053039865406109.005802BR5912Chef Cozinha6009SAO PAULO62070503***6304ED25" alt="QR Code PIX">
        </div>
        
        <div class="promo-banner">
            ⭐ Na próxima visita, mostre este recibo e ganhe 10% OFF na Sobremesa!
        </div>
    </div>
</body>
</html>
