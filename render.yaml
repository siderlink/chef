# =============================================================================
# Render Blueprint - Chef Cozinha
#
# COMO USAR (2 opções):
#   1) Render Dashboard → "New" → "Blueprint" → escolha este repositório.
#      O Render lê este arquivo e cria tudo automaticamente.
#   2) Rode:  powershell -ExecutionPolicy Bypass -File deploy\install-render.ps1
#
# IMPORTANTE:
#   - No plano Free os dados (SQLite) vivem no disco efêmero e são apagados
#     a cada deploy. Serve para TESTAR. Para dados permanentes, suba o plano
#     pago e descomente a seção "disk" abaixo.
#   - A variável JWT_SECRET é gerada automaticamente na 1ª subida.
# =============================================================================
services:
  - type: web
    name: chef-cozinha
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
        value: ""    # vazio = aceita qualquer origem (ajuste depois)
      - key: CHEF_DATA_DIR
        value: "/opt/data"
    # ---- PARA DADOS PERMANENTES (plano pago) ------------------------------
    # O banco de dados SQLite agora será salvo neste disco persistente.
    disk:
      name: data
      mountPath: /opt/data
      sizeGB: 1
