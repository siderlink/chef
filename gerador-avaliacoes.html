<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Máquina de Avaliações 5 Estrelas - Cheff.pro</title>
  <link rel="icon" href="/icon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/phosphor/src/bold/style.css">
  <link rel="stylesheet" href="/vendor/phosphor/src/fill/style.css">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: rgba(255, 255, 255, 0.08);
      --primary: #fbbf24;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 24px; }
    .container { max-width: 600px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 30px; }
    .header h1 { font-family: 'Outfit', sans-serif; color: var(--primary); font-size: 28px; }
    .header p { color: var(--text-muted); font-size: 14px; margin-top: 8px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; text-align: center; }
    .btn { background: #25d366; color: white; border: none; padding: 12px 24px; font-weight: 800; font-size: 16px; border-radius: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 14px rgba(37,211,102,0.3); }
    .input-group { margin-bottom: 20px; text-align: left; }
    .input-group label { display: block; font-size: 13px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; }
    .input-group input { width: 100%; padding: 12px; border-radius: 8px; background: rgba(0,0,0,0.2); border: 1px solid var(--border); color: white; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1><i class="ph-fill ph-star"></i> Máquina de 5 Estrelas</h1>
      <p>Envie links automáticos pedindo avaliações no Google Maps após os pedidos.</p>
    </div>
    
    <div class="card">
      <div class="input-group">
        <label>Seu Link do Google Meu Negócio</label>
        <input type="text" id="gmb-link" placeholder="Ex: https://g.page/r/.../review" value="https://g.page/r/review">
      </div>
      <div class="input-group">
        <label>Mensagem Mágica (PLG)</label>
        <textarea id="gmb-msg" rows="4" style="width: 100%; padding: 12px; border-radius: 8px; background: rgba(0,0,0,0.2); border: 1px solid var(--border); color: white; font-size: 14px;">Oi! Como foi sua experiência hoje? Se gostou, nos avalie com 5 estrelas aqui: {LINK_GOOGLE} 
Se algo não foi perfeito, nos responda aqui para resolvermos! 

⚡ Enviado pelo sistema Cheff.pro</textarea>
      </div>

      <div style="background: rgba(37,211,102,0.1); padding: 16px; border-radius: 12px; margin-bottom: 24px; border: 1px solid rgba(37,211,102,0.2); text-align: left;">
        <h4 style="color: #25d366; font-size: 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px;"><i class="ph-bold ph-whatsapp-logo"></i> Disparo em Massa</h4>
        <p style="font-size: 13px; color: var(--text-muted); line-height: 1.5;">O sistema encontrou <strong>14 clientes recentes</strong> que concluíram pedidos nas últimas 2h mas ainda não avaliaram o restaurante.</p>
      </div>

      <button class="btn" onclick="disparar()">
        <i class="ph-bold ph-paper-plane-right"></i> Disparar Pesquisas no WhatsApp
      </button>
    </div>
  </div>

  <script>
    function disparar() {
      const link = document.getElementById('gmb-link').value;
      const msg = document.getElementById('gmb-msg').value.replace('{LINK_GOOGLE}', link);
      
      // Simulate sending via WA
      window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
      alert('Iniciando disparos! O WhatsApp Web será aberto com as mensagens preparadas.');
    }
  </script>
</body>
</html>
