<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Estoque Preditivo IA | Chef Cozinha</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root { --bg: #0f111a; --card: #1e2130; --text: #e2e8f0; --primary: #fc4b15; --green: #10b981; --red: #ef4444; --yellow: #f59e0b; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 30px; margin: 0; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .card { background: var(--card); border-radius: 12px; padding: 20px; position: relative; }
        .alert { position: absolute; top: -10px; right: -10px; background: var(--red); color: #fff; padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: 800; animation: pulse 2s infinite; }
        .progress-bg { background: rgba(255,255,255,0.1); height: 10px; border-radius: 5px; margin: 15px 0; overflow: hidden; }
        .progress-bar { height: 100%; border-radius: 5px; }
        .title { font-size: 18px; font-weight: 700; margin: 0 0 5px 0; }
        .info { font-size: 14px; color: #94a3b8; display: flex; justify-content: space-between; margin-bottom: 5px; }
        .ai-insight { background: rgba(252, 75, 21, 0.1); border-left: 3px solid var(--primary); padding: 10px; border-radius: 4px; font-size: 13px; margin-top: 15px; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1 style="margin:0; color:var(--primary);"><i class="ph-bold ph-brain"></i> Estoque Preditivo (IA)</h1>
            <p style="margin:5px 0 0 0; color:#94a3b8;">A IA analisou as vendas dos últimos 30 dias para prever o fim do seu estoque.</p>
        </div>
        <button style="background:var(--primary); color:#fff; border:none; padding:12px 20px; border-radius:8px; font-weight:bold; cursor:pointer;"><i class="ph-bold ph-shopping-cart"></i> Gerar Lista de Compras</button>
    </div>

    <div class="grid" id="grid-estoque">
        <div style="text-align: center; width: 100%; color: #94a3b8; padding: 40px;">
            Carregando inteligência preditiva...
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetch('/api/hub-marketing/economia-desempenho', {
                headers: { 'Authorization': 'Bearer ' + localStorage.getItem('chef_token') }
            })
            .then(r => r.json())
            .then(data => {
                if(data.ok && data.data && data.data.itensPereciveis) {
                    renderCards(data.data.itensPereciveis);
                } else {
                    document.getElementById('grid-estoque').innerHTML = '<div style="color:red; width:100%; text-align:center;">Erro ao carregar dados.</div>';
                }
            })
            .catch(e => {
                console.error(e);
                document.getElementById('grid-estoque').innerHTML = '<div style="color:red; width:100%; text-align:center;">Falha na conexão com o servidor.</div>';
            });
        });

        function renderCards(itens) {
            const grid = document.getElementById('grid-estoque');
            grid.innerHTML = '';
            
            if (itens.length === 0) {
                grid.innerHTML = '<div style="width:100%; text-align:center; padding: 30px; color: var(--green);">Nenhum risco no estoque detectado! 🎉</div>';
                return;
            }

            itens.forEach(item => {
                // Cálculo ilustrativo para progress bar (0 a 100%)
                const percEstoque = Math.min(Math.max((item.estoque / 50) * 100, 10), 100); 
                const colorVar = percEstoque < 30 ? 'var(--red)' : (percEstoque < 60 ? 'var(--yellow)' : 'var(--green)');
                
                const card = document.createElement('div');
                card.className = 'card';
                if (percEstoque < 30) {
                    card.style.border = '1px solid var(--red)';
                }

                card.innerHTML = \`
                    \${percEstoque < 30 ? \`<div class="alert">\${item.validade}</div>\` : ''}
                    <h3 class="title">\${item.nome}</h3>
                    <div class="info"><span>Estoque Atual: \${item.estoque} un/kg</span><span>Custo: R$ \${item.custo_unitario.toFixed(2)}</span></div>
                    <div class="progress-bg"><div class="progress-bar" style="width: \${percEstoque}%; background: \${colorVar};"></div></div>
                    <div class="ai-insight"><strong>Insight Gemini:</strong> \${item.acao_sugerida}</div>
                \`;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
