<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Hub do Entregador</title>
  <link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiQXBwIEVudHJlZ2Fkb3IiLCJzaG9ydF9uYW1lIjoiRW50cmVnYWRvciIsInN0YXJ0X3VybCI6Ii9wd2EtbW90b2JveS5odG1sIiwiZGlzcGxheSI6InN0YW5kYWxvbmUiLCJiYWNrZ3JvdW5kX2NvbG9yIjoiIzFmMjkzNyIsInRoZW1lX2NvbG9yIjoiI2Y1OWUwYiJ9">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/phosphor/src/bold/style.css">
  <link rel="stylesheet" href="/vendor/phosphor/src/fill/style.css">
  <script src="/socket.io/socket.io.js"></script>
  
  <style>
    :root { --bg: #111827; --panel: #1f2937; --primary: #f59e0b; --text: #f9fafb; --muted: #9ca3af; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; user-select: none; }
    body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    
    .header { padding: 20px; background: var(--panel); border-bottom: 1px solid #374151; padding-top: env(safe-area-inset-top, 20px); display: flex; justify-content: space-between; align-items: center; }
    .header-title { font-family: 'Outfit'; font-size: 20px; font-weight: 900; color: var(--primary); display: flex; align-items: center; gap: 8px; }
    
    .status-btn { background: #10b981; color: #fff; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 13px; display: flex; align-items: center; gap: 6px; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); transition: 0.3s; }
    .status-btn.offline { background: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }

    .dash-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 20px; }
    .metric-card { background: var(--panel); padding: 16px; border-radius: 16px; text-align: center; border: 1px solid #374151; }
    .metric-card h3 { font-size: 12px; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
    .metric-card p { font-family: 'Outfit'; font-size: 24px; font-weight: 900; }
    .metric-card p.ganho { color: #10b981; }

    .map-preview { height: 120px; background: url('https://developers.google.com/static/maps/images/landing/hero_maps_static_api.png') center/cover; margin: 0 20px 20px 20px; border-radius: 16px; border: 2px solid var(--primary); position: relative; overflow: hidden; }
    .map-overlay { position: absolute; bottom: 0; width: 100%; background: linear-gradient(transparent, rgba(0,0,0,0.8)); padding: 10px; text-align: center; font-weight: bold; font-size: 12px; color: var(--primary); }

    .deliveries { flex: 1; overflow-y: auto; padding: 0 20px 100px 20px; }
    .section-title { font-size: 14px; font-weight: 700; color: var(--muted); margin-bottom: 12px; text-transform: uppercase; }

    .d-card { background: var(--panel); border: 1px solid #374151; border-radius: 16px; padding: 16px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 12px; }
    .d-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .d-header h4 { font-size: 16px; font-weight: bold; }
    .d-header span { font-size: 12px; color: var(--muted); }
    .d-address { font-size: 13px; color: #d1d5db; display: flex; gap: 8px; align-items: center; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 8px; }
    .d-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    
    .btn-rota { background: #3b82f6; color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 13px; display: flex; justify-content: center; align-items: center; gap: 6px; text-decoration: none; }
    .btn-done { background: #10b981; color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 13px; display: flex; justify-content: center; align-items: center; gap: 6px; cursor: pointer; }

    .empty-state { text-align: center; padding: 40px 0; color: var(--muted); }
    .empty-state i { font-size: 48px; opacity: 0.5; margin-bottom: 12px; }

  </style>
</head>
<body>

  <header class="header">
    <div class="header-title"><i class="ph-fill ph-moped"></i> Cheff.pro Entregas</div>
    <button class="status-btn" id="btn-status" onclick="toggleStatus()">
      <i class="ph-fill ph-check-circle"></i> ONLINE
    </button>
  </header>

  <div class="dash-metrics">
    <div class="metric-card">
      <h3>Entregas Hoje</h3>
      <p id="qtd-entregas">0</p>
    </div>
    <div class="metric-card">
      <h3>Ganhos (Taxa)</h3>
      <p class="ganho" id="val-ganho">R$ 0,00</p>
    </div>
  </div>

  <div class="map-preview">
    <div class="map-overlay">Radar GPS Ativo</div>
  </div>

  <div class="deliveries">
    <h3 class="section-title">Pedidos para Entrega</h3>
    <div id="lista-entregas">
      <div class="empty-state">Buscando corridas...</div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('chef_token') || '';
    const restId = localStorage.getItem('restaurante_id') || '1';
    const socket = io({ query: { token, restaurante_id: restId } });

    let isOnline = true;
    function toggleStatus() {
      const btn = document.getElementById('btn-status');
      isOnline = !isOnline;
      if(isOnline) {
        btn.classList.remove('offline');
        btn.innerHTML = '<i class="ph-fill ph-check-circle"></i> ONLINE';
        document.querySelector('.map-overlay').innerText = 'Radar GPS Ativo';
        socket.emit('get_pedidos');
      } else {
        btn.classList.add('offline');
        btn.innerHTML = '<i class="ph-fill ph-minus-circle"></i> OFFLINE';
        document.querySelector('.map-overlay').innerText = 'Radar Desligado';
        document.getElementById('lista-entregas').innerHTML = `<div class="empty-state"><i class="ph-fill ph-moon"></i><p>Você está offline.</p></div>`;
      }
    }

    socket.on('connect', () => { if(isOnline) socket.emit('get_pedidos'); });
    socket.on('pedido_adicionado', () => { if(isOnline) socket.emit('get_pedidos'); });
    socket.on('pedido_status_alterado', () => { if(isOnline) socket.emit('get_pedidos'); });

    socket.on('pedidos_atualizados', (pedidos) => {
      if(!isOnline) return;

      // Filtrar apenas pedidos Delivery que estão Prontos ou Em Rota
      const entregas = (pedidos || []).filter(p => 
        (p.sector === 'Delivery' || (p.localName && p.localName.toLowerCase().includes('delivery'))) &&
        (p.status === 'Pronto' || p.status === 'Em Rota' || p.status === 'Saiu para Entrega')
      );

      // Metricas fakes para o entregador baseado no storage local
      const entregasFeitas = parseInt(localStorage.getItem('entregas_hoje') || '0');
      document.getElementById('qtd-entregas').innerText = entregasFeitas;
      document.getElementById('val-ganho').innerText = 'R$ ' + (entregasFeitas * 5.50).toFixed(2).replace('.',',');

      const lista = document.getElementById('lista-entregas');
      
      if(entregas.length === 0) {
        lista.innerHTML = `<div class="empty-state"><i class="ph-fill ph-coffee"></i><p>Nenhuma entrega na fila.</p></div>`;
        return;
      }

      lista.innerHTML = entregas.map(p => {
        const endStr = (p.cliente_endereco || 'Endereço não informado').replace(/<[^>]*>?/gm, '');
        const wazeLink = `https://waze.com/ul?q=${encodeURIComponent(endStr)}`;
        const total = parseFloat(String(p.total).replace(',','.')) || 0;
        
        return `
          <div class="d-card">
            <div class="d-header">
              <div>
                <h4>Pedido #${p.id}</h4>
                <span style="color:var(--primary); font-weight:bold;">Cobrar: R$ ${total.toFixed(2).replace('.',',')}</span>
              </div>
              <span style="background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 6px;">${p.status}</span>
            </div>
            <div class="d-address">
              <i class="ph-fill ph-map-pin" style="color:var(--primary); font-size: 18px;"></i>
              <span style="line-height: 1.3;">${endStr}</span>
            </div>
            <div class="d-actions">
              <a href="${wazeLink}" target="_blank" class="btn-rota"><i class="ph-bold ph-navigation-arrow"></i> Rota GPS</a>
              <button class="btn-done" onclick="marcarEntregue(${p.id})"><i class="ph-bold ph-check"></i> Entregue</button>
            </div>
          </div>
        `;
      }).join('');
    });

    function marcarEntregue(id) {
      if(confirm('Confirmar entrega ao cliente?')) {
        // Incrementa metricas
        let e = parseInt(localStorage.getItem('entregas_hoje') || '0');
        localStorage.setItem('entregas_hoje', e + 1);
        
        // Emite atualização de status
        socket.emit('update_pedido_status', { id, status: 'Entregue' });
        
        // Remove otimista da tela
        setTimeout(() => socket.emit('get_pedidos'), 300);
      }
    }

  </script>
</body>
</html>
