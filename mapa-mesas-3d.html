<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de Mesas 3D - Visão Espacial</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/phosphor/src/bold/style.css">
  <link rel="stylesheet" href="/vendor/phosphor/src/fill/style.css">
  <script src="/socket.io/socket.io.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --floor: #1e293b;
      --grid: rgba(255, 255, 255, 0.05);
      
      --mesa-livre: #10b981;
      --mesa-ocupada: #ef4444;
      --mesa-conta: #f59e0b;
      --mesa-chamando: #3b82f6;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background-color: var(--bg); color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

    /* HUD */
    .hud { position: absolute; top: 0; left: 0; width: 100%; padding: 24px; display: flex; justify-content: space-between; z-index: 100; pointer-events: none; }
    .hud-title { font-family: 'Outfit'; font-size: 24px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 4px 10px rgba(0,0,0,0.5); pointer-events: all; }
    .hud-stats { display: flex; gap: 16px; pointer-events: all; }
    .stat-pill { background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); padding: 8px 16px; border-radius: 20px; font-weight: 600; font-size: 14px; border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 8px; }
    
    .c-livre { color: var(--mesa-livre); }
    .c-ocupada { color: var(--mesa-ocupada); }
    .c-conta { color: var(--mesa-conta); }

    /* Scene 3D */
    .scene-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; perspective: 1200px; overflow: hidden; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); cursor: grab; }
    .scene-wrapper:active { cursor: grabbing; }

    .floor {
      width: 800px;
      height: 800px;
      background-color: var(--floor);
      background-image: 
        linear-gradient(var(--grid) 2px, transparent 2px),
        linear-gradient(90deg, var(--grid) 2px, transparent 2px);
      background-size: 80px 80px;
      
      transform-style: preserve-3d;
      transform: rotateX(60deg) rotateZ(-45deg);
      transition: transform 0.1s ease-out;
      position: relative;
      border: 4px solid #334155;
      box-shadow: 0 50px 100px rgba(0,0,0,0.8);
    }

    /* Mesas (Objetos 3D) */
    .mesa-3d {
      position: absolute;
      width: 60px;
      height: 60px;
      transform-style: preserve-3d;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
    }
    
    .mesa-3d:hover { transform: translateZ(10px); }

    /* Cilindro / Cubo da Mesa */
    .m-tampo {
      position: absolute; width: 60px; height: 60px; background: var(--mesa-livre); border-radius: 12px; transform: translateZ(30px); display: flex; align-items: center; justify-content: center; font-family: 'Outfit'; font-weight: 900; font-size: 18px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.2); box-shadow: inset 0 0 15px rgba(0,0,0,0.2); transition: background 0.3s;
    }
    .m-shadow {
      position: absolute; width: 60px; height: 60px; background: rgba(0,0,0,0.5); border-radius: 12px; transform: translateZ(0px); filter: blur(4px);
    }
    
    .m-lateral-1 { position: absolute; width: 60px; height: 30px; background: rgba(0,0,0,0.3); transform: rotateX(-90deg) translateZ(30px); transform-origin: bottom; border-radius: 0 0 12px 12px; transition: background 0.3s; }
    .m-lateral-2 { position: absolute; width: 30px; height: 60px; background: rgba(0,0,0,0.4); transform: rotateY(90deg) translateZ(30px); transform-origin: right; border-radius: 12px 0 0 12px; transition: background 0.3s; }

    /* Cores de Status */
    .mesa-3d.ocupada .m-tampo { background: var(--mesa-ocupada); box-shadow: 0 0 20px rgba(239, 68, 68, 0.5); }
    .mesa-3d.ocupada .m-lateral-1 { background: #b91c1c; }
    .mesa-3d.ocupada .m-lateral-2 { background: #991b1b; }

    .mesa-3d.conta .m-tampo { background: var(--mesa-conta); box-shadow: 0 0 20px rgba(245, 158, 11, 0.5); }
    .mesa-3d.conta .m-lateral-1 { background: #b45309; }
    .mesa-3d.conta .m-lateral-2 { background: #92400e; }
    
    .mesa-3d.chamando .m-tampo { background: var(--mesa-chamando); animation: bounce 1s infinite; box-shadow: 0 0 30px rgba(59, 130, 246, 0.8); }
    .mesa-3d.chamando .m-lateral-1 { background: #1d4ed8; }
    .mesa-3d.chamando .m-lateral-2 { background: #1e3a8a; }

    @keyframes bounce { 0%, 100% { transform: translateZ(30px); } 50% { transform: translateZ(50px); } }

    /* Indicador Flutuante (Info) */
    .m-info {
      position: absolute;
      top: -40px; left: 50%; transform: translateX(-50%) rotateX(-90deg) rotateY(45deg); /* Compensa a rotaǜo do piso */
      background: rgba(0,0,0,0.8); padding: 4px 8px; border-radius: 6px; font-size: 11px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.2s; font-weight: 600; color: #fff; border: 1px solid rgba(255,255,255,0.2);
    }
    .mesa-3d:hover .m-info { opacity: 1; }

    /* Decorações do Cenário */
    .decor-plant { position: absolute; width: 40px; height: 40px; transform-style: preserve-3d; }
    .dp-tampo { position: absolute; width: 40px; height: 40px; background: #065f46; border-radius: 50%; transform: translateZ(40px); box-shadow: inset -5px -5px 10px rgba(0,0,0,0.5); }
    .dp-base { position: absolute; width: 20px; height: 20px; background: #78350f; border-radius: 50%; transform: translateZ(0px) translateX(10px) translateY(10px); }
    .dp-trunk { position: absolute; width: 20px; height: 40px; background: #92400e; transform: rotateX(-90deg) translateZ(20px) translateX(10px) translateY(0px); transform-origin: bottom; border-radius: 10px; }
    
    .decor-wall { position: absolute; background: #334155; transform-style: preserve-3d; }
    .dw-top { position: absolute; background: #475569; transform: translateZ(100px); }

  </style>
</head>
<body>

  <div class="hud">
    <div class="hud-title"><i class="ph-fill ph-cube"></i> Radar 3D</div>
    <div class="hud-stats">
      <div class="stat-pill"><div class="pulse-dot" style="background:var(--mesa-livre);width:10px;height:10px;border-radius:50%;"></div> Livres: <span id="st-livre">0</span></div>
      <div class="stat-pill"><div class="pulse-dot" style="background:var(--mesa-ocupada);width:10px;height:10px;border-radius:50%;"></div> Ocupadas: <span id="st-ocup">0</span></div>
      <div class="stat-pill"><div class="pulse-dot" style="background:var(--mesa-conta);width:10px;height:10px;border-radius:50%;"></div> Fechando: <span id="st-conta">0</span></div>
    </div>
  </div>

  <div class="scene-wrapper" id="scene">
    <div class="floor" id="floor">
      
      <!-- Paredes Decorativas (Balcão de Fundo) -->
      <div class="decor-wall" style="width: 800px; height: 20px; top: 0; left: 0; transform: rotateX(-90deg); transform-origin: top; background: #1e293b;"></div>
      
      <!-- Plantas Decorativas -->
      <div class="decor-plant" style="top: 40px; left: 40px;">
        <div class="dp-base"></div><div class="dp-trunk"></div><div class="dp-tampo"></div>
      </div>
      <div class="decor-plant" style="top: 40px; right: 40px;">
        <div class="dp-base"></div><div class="dp-trunk"></div><div class="dp-tampo"></div>
      </div>

      <!-- Mesas Injetadas Via JS -->
      <div id="mesas-container"></div>
      
    </div>
  </div>

  <script>
    const token = localStorage.getItem('chef_token') || '';
    const restId = localStorage.getItem('restaurante_id') || '1';
    const socket = io({ query: { token, restaurante_id: restId } });

    // Drag to rotate logic
    let isDragging = false;
    let prevX = 0, prevY = 0;
    let rotX = 60, rotZ = -45;

    const scene = document.getElementById('scene');
    const floor = document.getElementById('floor');

    scene.addEventListener('mousedown', (e) => { isDragging = true; prevX = e.clientX; prevY = e.clientY; });
    window.addEventListener('mouseup', () => { isDragging = false; });
    window.addEventListener('mousemove', (e) => {
      if(!isDragging) return;
      const dx = e.clientX - prevX;
      const dy = e.clientY - prevY;
      rotZ += dx * 0.5;
      rotX -= dy * 0.5;
      if(rotX < 20) rotX = 20; if(rotX > 85) rotX = 85; // Limites de inclinação
      floor.style.transform = `rotateX(${rotX}deg) rotateZ(${rotZ}deg)`;
      prevX = e.clientX; prevY = e.clientY;
      
      // Ajustar label floats
      document.querySelectorAll('.m-info').forEach(el => {
        el.style.transform = `translateX(-50%) rotateZ(${-rotZ}deg) rotateX(${-rotX}deg)`;
      });
    });

    // Touch
    scene.addEventListener('touchstart', (e) => { isDragging = true; prevX = e.touches[0].clientX; prevY = e.touches[0].clientY; });
    window.addEventListener('touchend', () => { isDragging = false; });
    window.addEventListener('touchmove', (e) => {
      if(!isDragging) return;
      const dx = e.touches[0].clientX - prevX;
      const dy = e.touches[0].clientY - prevY;
      rotZ += dx * 0.5; rotX -= dy * 0.5;
      if(rotX < 20) rotX = 20; if(rotX > 85) rotX = 85;
      floor.style.transform = `rotateX(${rotX}deg) rotateZ(${rotZ}deg)`;
      prevX = e.touches[0].clientX; prevY = e.touches[0].clientY;
      document.querySelectorAll('.m-info').forEach(el => {
        el.style.transform = `translateX(-50%) rotateZ(${-rotZ}deg) rotateX(${-rotX}deg)`;
      });
    });

    // Dados das Mesas
    socket.on('connect', () => socket.emit('get_mesas'));

    socket.on('mesas_atualizadas', (mesas) => {
      const container = document.getElementById('mesas-container');
      container.innerHTML = '';
      
      let qtdL = 0, qtdO = 0, qtdC = 0;

      // Se nǜo houver posiǜo X/Y no banco, simulamos uma disposiǜo grid 3D linda
      let col = 0, row = 0;
      const gridSize = 120; // Espaamento

      (mesas || []).forEach((m, idx) => {
        let cls = '';
        if(m.status === 'Ocupada') { cls = 'ocupada'; qtdO++; }
        else if(m.status === 'Conta Pedida') { cls = 'conta'; qtdC++; }
        else { qtdL++; }

        // Posicionamento fake se nǜo existir
        let x = 100 + (col * gridSize);
        let y = 100 + (row * gridSize);
        
        col++;
        if(col > 4) { col = 0; row++; }

        const mesaHtml = `
          <div class="mesa-3d ${cls}" style="left: ${x}px; top: ${y}px;" onclick="abrirPDV('${m.nome}')">
            <div class="m-shadow"></div>
            <div class="m-lateral-2"></div>
            <div class="m-lateral-1"></div>
            <div class="m-tampo">${m.nome.replace('Mesa ', '')}</div>
            <div class="m-info" style="transform: translateX(-50%) rotateZ(${-rotZ}deg) rotateX(${-rotX}deg)">${m.status || 'Livre'} • ${m.capacidade || 4} Lugares</div>
          </div>
        `;
        container.innerHTML += mesaHtml;
      });

      document.getElementById('st-livre').innerText = qtdL;
      document.getElementById('st-ocup').innerText = qtdO;
      document.getElementById('st-conta').innerText = qtdC;
    });

    socket.on('chamado_garcom', (data) => {
      // Simula uma mesa chamando (pisca em azul)
      socket.emit('get_mesas'); // Re-render for simplicity, real app would just find DOM element and toggle class 'chamando'
    });

    function abrirPDV(nome) {
      window.open('/pdv-mobile.html?mesa=' + encodeURIComponent(nome), '_blank');
    }

  </script>
</body>
</html>
