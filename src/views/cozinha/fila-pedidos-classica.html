<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Fila de Pedidos - Clássica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/fila-classica.css">
  <link rel="stylesheet" href="/vendor/phosphor/src/regular/style.css">
  <link rel="stylesheet" href="/vendor/phosphor/src/bold/style.css">
  <link rel="stylesheet" href="/vendor/phosphor/src/fill/style.css">
  <link rel="stylesheet" href="/dark-mode.css">
  <script src="/theme-manager.js?v=20260829t1"></script>
  <script src="/vendor/morphdom/morphdom.min.js"></script>
  <script src="/locales.js"></script>
  <script src="/broadcast.js"></script>
  <script src="/i18n.js"></script>
  <link rel="icon" href="/icons/icon.ico">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#fc4b15">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chef Cozinha">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <script src="/socket.io.min.js"></script>
  <script src="/chef-tz.js"></script>
  <script>
    (function kdsDetectarVersaoNova() {
      const localModo = localStorage.getItem('fila_modo') || localStorage.getItem('chef_fila_modo');
      if (localModo === 'nova') {
        window.location.replace('/fila-pedidos.html');
        return;
      }
      fetch('/api/config')
        .then(r => r.json())
        .then(cfg => {
          if (cfg && String(cfg.fila_modo || '').toLowerCase() === 'nova') {
            localStorage.setItem('fila_modo', 'nova');
            localStorage.setItem('chef_fila_modo', 'nova');
            window.location.replace('/fila-pedidos.html');
          }
        })
        .catch(() => {});
    })();
  </script>
  <script src="fila-classica.js"></script>
</head>

<body>
  <div class="app-container">

    <!-- LEFT SIDEBAR (SECTORS - OCULTO NO MOBILE) -->
    <aside class="sidebar-sectors">
      <div style="width: 100%; display: flex; flex-direction: column;">
        <button class="status-btn" onclick="toggleSidebarSectors()" title="Filtro de Fila" style="width: 100%; padding: 12px 0; border-radius: 8px;">
          <i class="ph ph-funnel" style="color: #1a73e8; font-size: 24px;"></i>
          <span id="current-sector-label-sidebar" style="color: #1a73e8; font-weight: 700; margin-top: 4px;">Todos</span>
        </button>

        <div id="sidebar-sectors-dropdown" style="display: flex; flex-direction: column; gap: 8px; width: 100%; overflow: hidden; max-height: 0px; transition: max-height 0.4s ease-in-out; flex-shrink: 0; background: var(--bg-sidebar); padding-top: 0;">
          <div class="sector-btn" data-sector="Todos" onclick="filtrarSetor('Todos'); toggleSidebarSectors();">
            <div class="sector-icon bg-gray"><i class="ph ph-storefront"></i></div>
            <span>Todos</span>
          </div>
          <div id="sidebar-sectors-dinamicos"></div>
        </div>
      </div>

      <div style="margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border-color, #eef2f6); width: 100%;">
        <a href="/index.html" style="margin-top: auto; padding: 16px; text-decoration: none; color: var(--text-secondary, gray); display: flex; flex-direction: column; align-items: center; gap: 8px;">
          <i class="ph ph-house" style="font-size: 36px;"></i>
          <span>Caixa</span>
        </a>
      </div>
    </aside>
    <div class="sidebar-sectors-resizer"></div>

    <!-- MAIN CONTENT -->
    <main class="main-content">

      <!-- CONTENT BODY -->
      <div class="content-body">

        <!-- QUEUE SECTION (CARDS / LIST) -->
        <div class="queue-section">

          <!-- FILTRO POR TIPO (Todos / Porções / A La Carte) -->
          <div class="queue-tipo-bar" id="queue-tipo-bar">
            <span class="queue-tipo-label"><i class="ph ph-funnel"></i> Tipo:</span>
            <button class="queue-tipo-btn active" data-tipo="todos" onclick="window.setFiltroTipo('todos')"><i class="ph ph-list"></i><span>Todos</span></button>
            <button class="queue-tipo-btn" data-tipo="porcao" onclick="window.setFiltroTipo('porcao')"><i class="ph ph-bowl-food"></i><span>Porções</span></button>
            <button class="queue-tipo-btn" data-tipo="alacarte" onclick="window.setFiltroTipo('alacarte')"><i class="ph ph-fork-knife"></i><span>A La Carte</span></button>
          </div>

          <!-- SETOR ATUAL + TAMANHO DA LETRA (A- / A+) -->
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 2px; font-size: 12px;">
            <span style="color: var(--text-secondary, #64748b); font-weight: 600;"><i class="ph ph-storefront" style="color: #1a73e8;"></i> Setor atual: <span id="current-sector-label" style="color: #1a73e8; font-weight: 700;">Todos</span></span>
            <div style="display: flex; gap: 6px; align-items: center;">
              <button id="btn-font-dec" class="fila-settings-btn" title="Diminuir letra" style="min-width: 42px;"><i class="ph ph-text-aa-offset-decrease"></i><span>A-</span></button>
              <button id="btn-font-inc" class="fila-settings-btn" title="Aumentar letra" style="min-width: 42px;"><i class="ph ph-text-aa-offset-increase"></i><span>A+</span></button>
            </div>
          </div>

          <!-- QUEUE HEADER (COLUMNS) - REORDENÁVEL E REDIMENSIONÁVEL -->
          <div class="queue-header" id="queue-header-sortable">
            <div class="col-quantidade" data-col="quantidade" style="cursor: grab; position: relative;">
              <i class="ph ph-dots-six-vertical" style="color:#aaa;"></i> Quantidade
              <div class="col-resize-handle" data-col="quantidade"></div>
            </div>
            <div class="col-produto" data-col="produto" style="cursor: grab; position: relative;">
              <i class="ph ph-dots-six-vertical" style="color:#aaa;"></i> Produto
              <div class="col-resize-handle" data-col="produto"></div>
            </div>
            <div class="col-local" data-col="local" style="cursor: grab; position: relative;">
              <i class="ph ph-dots-six-vertical" style="color:#aaa;"></i> Local
              <div class="col-resize-handle" data-col="local"></div>
            </div>
            <div class="col-pronto" data-col="pronto" style="cursor: grab; position: relative;">
              <i class="ph ph-dots-six-vertical" style="color:#aaa;"></i> Pronto
              <div class="col-resize-handle" data-col="pronto"></div>
            </div>
          </div>

          <div class="queue-list" id="queue-list">
            <!-- Items generated by JS -->
          </div>
        </div>

        <div class="right-panel-status-resizer"></div>

        <!-- RIGHT PANEL (STATUS FILTERS & SETTINGS) -->
        <aside class="right-panel-status">
          <div class="status-filters">
            <button class="status-btn" data-status="Em espera" onclick="filtrarFila('Em espera')">
              <i class="ph ph-hourglass-high" style="color: #f39c12;"></i>
              <span>Espera</span>
            </button>
            <button class="status-btn" data-status="Em preparo" onclick="filtrarFila('Em preparo')">
              <i class="ph ph-fire" style="color: #7e8299;"></i>
              <span style="color: #7e8299;">Preparo</span>
            </button>
            <button class="status-btn" data-status="Pronto" onclick="filtrarFila('Pronto')">
              <i class="ph ph-bowl-food" style="color: #333333;"></i>
              <span>Prontos</span>
            </button>
          </div>

          <div id="fila-search-wrapper" style="margin-top: 8px; width: 100%;">
            <input type="text" id="fila-search-input" placeholder="Buscar por produto ou mesa..." oninput="window.filaSearchInput && window.filaSearchInput()" style="width:100%;padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;outline:none;background:#f8fafc;">
          </div>
          <div style="margin-top: 6px; width: 100%; display: flex; gap: 6px;">
            <button id="btn-sort-delay" class="status-btn" onclick="window.toggleSortDelay()" style="flex:1; font-size:11px; padding: 6px 4px;">
              <i class="ph ph-sort-ascending"></i> <span>Mais antigos</span>
            </button>
            <button id="btn-fila-settings-html" class="status-btn" onclick="document.getElementById('modal-fila-settings').style.display='flex'" style="flex:0 0 auto; font-size:11px; padding: 6px 8px;" title="Configurações da Fila">
              <i class="ph ph-gear"></i>
            </button>
            <button id="btn-notificacoes" class="status-btn" onclick="window.ativarNotificacoes && window.ativarNotificacoes()" style="flex:0 0 auto; font-size:11px; padding: 6px 8px; white-space:nowrap; color:#1a73e8;" title="Ativar notificações push">
              <i class="ph ph-bell"></i>
            </button>
          </div>

          <div style="margin-top: auto; padding-top: 16px; border-top: 1px solid #eef2f6; width: 100%;">
            <div class="status-actions" style="display: flex; flex-direction: column; gap: 8px; width: 100%;">
              <button class="action-btn" onclick="window.location.href='/index.html'" style="width: 100%;">
                <i class="ph ph-door" style="color: #eb5757;"></i>
                <span>Fechar</span>
              </button>
              <button class="action-btn" onclick="location.reload()" style="width: 100%;">
                <i class="ph ph-arrows-clockwise" style="color: #333333;"></i>
                <span>Atualizar</span>
              </button>
            </div>
          </div>
        </aside>

      </div>
    </main>
  </div>

  <!-- MODAL CONFIGURAÇÕES DA FILA -->
  <div id="modal-fila-settings" class="fila-settings-overlay" style="display:none;" onclick="if(event.target===this)this.style.display='none'">
    <div class="fila-settings-card" style="max-height: 90vh; overflow-y: auto;">
      <div class="fila-settings-header">
        <i class="ph ph-gear" style="font-size: 20px; color: #1a73e8;"></i>
        <span>Configurações da Fila</span>
        <button onclick="document.getElementById('modal-fila-settings').style.display='none'" class="fila-settings-close">&times;</button>
      </div>
      <div class="fila-settings-body">

        <!-- SEÇÃO FILTRAR POR SETOR / COZINHA -->
        <div class="fila-settings-group">
          <span class="fila-settings-label">Setor / Cozinha</span>
          <div class="fila-settings-grid" style="grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));">
            <button class="fila-settings-btn sector-modal-btn active" data-sector="Todos" onclick="filtrarSetor('Todos')">
              <i class="ph ph-storefront"></i><span>Todos</span>
            </button>
            <div id="modal-settings-setores-dinamicos" style="display: contents;"></div>
          </div>
        </div>

        <!-- SEÇÃO FILTRAR POR STATUS -->
        <div class="fila-settings-group">
          <span class="fila-settings-label">Status do Pedido</span>
          <div class="fila-settings-grid" style="grid-template-columns: 1fr 1fr 1fr;">
            <button class="fila-settings-btn status-btn" data-status="Em espera" onclick="filtrarFila('Em espera')">
              <i class="ph ph-hourglass-high" style="color: #f39c12;"></i><span>Espera</span>
            </button>
            <button class="fila-settings-btn status-btn" data-status="Em preparo" onclick="filtrarFila('Em preparo')">
              <i class="ph ph-fire" style="color: #e74c3c;"></i><span>Preparo</span>
            </button>
            <button class="fila-settings-btn status-btn" data-status="Pronto" onclick="filtrarFila('Pronto')">
              <i class="ph ph-bowl-food" style="color: #27ae60;"></i><span>Prontos</span>
            </button>
          </div>
        </div>

        <!-- SEÇÃO BARRAS LATERAIS -->
        <div class="fila-settings-group">
          <span class="fila-settings-label">Barras Laterais</span>
          <div class="fila-settings-grid" style="grid-template-columns: 1fr 1fr 1fr;">
            <button class="fila-settings-btn sidebar-mode-btn" data-sidebar-mode="fixa" onclick="window.setSidebarDisplayMode('fixa')">
              <i class="ph ph-push-pin"></i><span>Fixas</span>
            </button>
            <button class="fila-settings-btn sidebar-mode-btn" data-sidebar-mode="hover" onclick="window.setSidebarDisplayMode('hover')">
              <i class="ph ph-sidebar"></i><span>Auto-Esconder</span>
            </button>
            <button class="fila-settings-btn sidebar-mode-btn active" data-sidebar-mode="oculta" onclick="window.setSidebarDisplayMode('oculta')">
              <i class="ph ph-eye-slash"></i><span>Ocultas</span>
            </button>
          </div>
        </div>

        <!-- SEÇÃO DISPOSIÇÃO -->
        <div class="fila-settings-group">
          <span class="fila-settings-label">Disposição</span>
          <div class="fila-settings-grid">
            <button class="fila-settings-btn layout-btn active" data-mode="lista" onclick="window.alterarModoDisposicao('lista')">
              <i class="ph ph-list-bullets"></i><span>Linhas</span>
            </button>
            <button class="fila-settings-btn layout-btn" data-mode="tv" onclick="window.alterarModoDisposicao('tv')">
              <i class="ph ph-television"></i><span>Modo TV</span>
            </button>
          </div>
        </div>

        <!-- SEÇÃO TAMANHO DA LETRA -->
        <div class="fila-settings-group">
          <span class="fila-settings-label">Tamanho da Letra</span>
          <div class="fila-settings-row">
            <button class="fila-settings-btn flex-1" id="popup-btn-font-dec">
              <i class="ph ph-text-aa-offset-decrease"></i><span>a-</span>
            </button>
            <button class="fila-settings-btn flex-1" id="popup-btn-font-inc">
              <i class="ph ph-text-aa-offset-increase"></i><span>A+</span>
            </button>
          </div>
        </div>

        <!-- SEÇÃO LAYOUT -->
        <div class="fila-settings-group">
          <span class="fila-settings-label">Layout</span>
          <div class="fila-settings-row">
            <button class="fila-settings-btn flex-1" onclick="window.resetColumnWidths && window.resetColumnWidths()">
              <i class="ph ph-arrow-counter-clock"></i><span>Resetar Colunas</span>
            </button>
          </div>
        </div>

        <!-- SEÇÃO DESTAQUE -->
        <div class="fila-settings-group">
          <span class="fila-settings-label">Destaque Novo Pedido</span>
          <div class="fila-settings-row fila-settings-input-row">
            <i class="ph ph-timer" style="font-size: 18px; color: #1a73e8;"></i>
            <input type="number" id="cfg-tempo-pulse" min="1" max="30" value="3" class="fila-settings-input">
            <span style="font-size: 12px; color: #64748b; font-weight: 600;">seg. piscando</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL SELEÇÃO DE FILA / SETOR -->
  <div id="modal-setor" class="modal-setor-overlay" style="display: none;">
    <div class="modal-setor-card">
      <div class="modal-setor-header">
        <span>Selecione a Fila / Setor</span>
        <button onclick="window.fecharModalSetor()" class="modal-setor-close">&times;</button>
      </div>
      <div class="modal-setor-grid">
        <button class="sector-modal-btn" data-sector="Todos" onclick="window.selecionarSetorModal('Todos')">
          <div class="sector-modal-icon bg-gray"><i class="ph ph-storefront"></i></div>
          <div class="sector-modal-info">
            <span class="sector-modal-title">Todos os Setores</span>
            <span class="sector-modal-sub">Visualizar todos os pedidos</span>
          </div>
        </button>
        <div id="modal-setor-dinamicos" style="display: contents;"></div>
      </div>
    </div>
  </div>

  <script src="/vendor/sortablejs/Sortable.min.js"></script>

  <!-- Floating Bulb FAB for Dicas Rápidas -->
  <button id="ia-gerente-fab" title="Dicas Rápidas da Cozinha" onclick="window.toggleDicasRapidas()" style="display:none;position:fixed;bottom:16px;left:16px;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);border:2px solid #f59e0b;box-shadow:0 4px 16px rgba(245,158,11,0.35);z-index:9999;cursor:pointer;align-items:center;justify-content:center;font-size:22px;transition:all 0.3s ease;">
    💡
    <span id="ia-gerente-badge" style="position:absolute;top:-2px;right:-2px;width:12px;height:12px;background:#ef4444;border-radius:50%;border:2px solid white;display:none;"></span>
  </button>

  <!-- IA Gerente Panel (cozinha) -->
  <div id="ia-gerente-panel" style="display:none;position:fixed;bottom:16px;left:16px;width:320px;max-width:calc(100vw - 32px);max-height:220px;overflow-y:auto;background:white;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,0.18);border:1px solid #e2e8f0;z-index:10000;padding:12px;font-size:12.5px;transition:all 0.4s cubic-bezier(0.16, 1, 0.3, 1);transform-origin:bottom left;">
    <div style="font-weight:700;font-size:13px;color:#1e293b;padding-bottom:8px;border-bottom:1px solid #e2e8f0;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;">
      <span style="display:flex;align-items:center;gap:6px;"><i class="ph ph-lightbulb-fill" style="color:#f59e0b;font-size:16px;"></i> Dicas Rápidas</span>
      <div style="display:flex;gap:6px;align-items:center;">
        <button onclick="window.minimizarDicasRapidas()" title="Minimizar para lâmpada" style="background:#f1f5f9;border:none;border-radius:6px;cursor:pointer;font-size:12px;padding:2px 6px;color:#64748b;font-weight:bold;">🗕</button>
        <button onclick="window.fecharDicasRapidas()" title="Fechar" style="background:#f1f5f9;border:none;border-radius:6px;cursor:pointer;font-size:14px;padding:2px 6px;color:#64748b;font-weight:bold;">&times;</button>
      </div>
    </div>
    <div id="ia-gerente-content"></div>
  </div>
  <script src="/fullscreen.js"></script>
  <script>window.PUSH_ROLE = 'cozinha';</script>
  <script src="/push-client.js"></script>
  <script src="/chef-colaborador-dock.js"></script>
  <script src="/chef-layout-injetor.js"></script>
</body>

</html>
